name: Build Windows Validator
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Dependencies
        run: dart pub get

      - name: Compile Windows Executable
        run: dart compile exe bin/xvo_validator.dart -o xvo_validator.exe

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xvo-validator-windows
          path: xvo_validator.exe
